[project]
name = "skn35-4th-1team"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "chromadb>=1.5.9",
    "django>=6.0,<6.1",
    "django-tidb[vector]>=6.0.1",
    "pymysql>=1.2.3",
    "django-ninja>=1.4",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "kiwipiepy>=0.21",
    "langgraph>=1.0",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# 3차 FastAPI 코드(backend/app)를 돌릴 때만 쓴다. Django 이식이 끝나면 지운다.
legacy = [
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
    "tidb-vector>=0.0.15",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
src = ["backend"]
