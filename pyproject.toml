[project]
name = "skn35-4th-1team"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "chromadb>=1.5.9",
    "django>=6.0,<6.1",
    "django-tidb[vector]>=6.0.1",
    "pymysql>=1.2.3",
    "django-ninja>=1.4",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.0",
    "mcp>=1.26,<2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "starlette",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
src = ["backend"]
extend-exclude = ["**/migrations"]
