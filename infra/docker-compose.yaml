# 실행: 레포 루트에서
#   ./infra/build-frontend.sh             # Flutter 빌드 → frontend/build/web
#   docker compose -f infra/docker-compose.yml up -d --build
name: docentalk

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      args:
        UV_GROUPS: ${UV_GROUPS:-}
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_MODULE: ${APP_MODULE:-config.asgi:application}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/build/web:/usr/share/nginx/html:ro
      # HTTPS 인증서 (EC2 에서 certbot 으로 발급, infra/README.md 참고)
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
