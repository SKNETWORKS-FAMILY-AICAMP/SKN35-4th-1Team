upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # certbot 인증서 발급용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API·관리자·MCP 는 Django 로
    location ~ ^/(api|admin|mcp)(/|$) {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 도슨트 SSE 스트리밍: 토큰이 모이지 않고 바로 전달되게
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 새 배포가 바로 보이도록 진입 파일은 캐시하지 않음
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 7d;
    }

    # Flutter 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
